spring.application.name=backend

# Credenciais ficam em backend/.env (ignorado pelo git). Veja .env.example.
spring.config.import=optional:file:.env[.properties]

# Supabase (PostgreSQL)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Schema gerenciado pelo Flyway; o Hibernate apenas valida.
# No Supabase o schema `public` já nasce com objetos padrão, por isso
# `baseline-on-migrate=true` com `baseline-version=0` permite rodar V1+.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
